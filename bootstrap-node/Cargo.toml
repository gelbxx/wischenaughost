[package]
name = "wghost-bootstrap"
description = "Bootstrap and relay node for WischenauGhost P2P network"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wghost-bootstrap"
path = "src/main.rs"

[dependencies]
libp2p = { version = "0.54", features = [
    "quic",
    "kad",
    "relay",
    "dcutr",
    "noise",
    "identify",
    "ping",
    "tokio",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
