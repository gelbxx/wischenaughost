[workspace]
members = [
    "wghost-core",
    "wghost-crypto",
    "wghost-network",
    "wghost-storage",
    "wghost-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/wischenaughost"

[workspace.dependencies]
# Crypto primitives
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Networking
libp2p = { version = "0.54", features = [
    "quic",
    "kad",
    "relay",
    "dcutr",
    "noise",
    "mdns",
    "tokio",
    "identify",
    "ping",
    "macros",
] }
tokio = { version = "1", features = ["full"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Serialization
prost = "0.13"
prost-types = "0.13"

# FFI
uniffi = "0.28"

# Error handling & logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Internal crates
wghost-core = { path = "wghost-core" }
wghost-crypto = { path = "wghost-crypto" }
wghost-network = { path = "wghost-network" }
wghost-storage = { path = "wghost-storage" }
